        material: GRASS_BLOCK
        name: "&aSMP"
        lore:
          - "&7Connect to SMP"
        actions:
          - "[PROXY] SMP"
      factions:
        slot: 12
        material: IRON_SWORD
        name: "&6Factions"
        lore:
