      spleef:
        slot: 16
        material: DIAMOND_SHOVEL
        name: "&bSpleef"
        actions:
          - "[COMMAND] console; cp teleport %player% Arcade Lobby_Games 12 9 -209 90.15 0.15"
      snake:
        slot: 19
        material: LIME_WOOL
        name: "&aSnake"
        actions:
          - "[COMMAND] console; cp teleport %player% Arcade Lobby_Games -464 132 -222 266.25"
      pool:
        slot: 20
        material: ENDER_PEARL
        name: "&8Pool"
        actions:
          - "[COMMAND] console; cp teleport %player% Arcade Lobby_Games -60 16 -153 359.443 7.35"
      parkour:
        slot: 21
        material: FEATHER
        name: "&eParkour"
        actions:
          - "[COMMAND] player; ajparkour start"
      tournaments:
