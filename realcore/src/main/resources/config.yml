# RealCore connects a Minecraft server to the RealFiction website.
# Never paste this file publicly. hmacSecret is private.

baseUrl: "https://realfiction.live"

# Unique identity for THIS backend. Every server on the network MUST use a
# different id. group lets website rewards target a set of servers
# (e.g. lobby/smp/arcade/anarchy/factions); 'global' rewards deliver anywhere.
# (Legacy flat keys serverId/serverGroup still work if this block is absent.)
server:
  id: "lobby-1"
  group: "lobby"
  displayName: "Lobby 1"
  # If true, RealCore disables itself when another live backend already owns this
  # id. Default false logs a severe warning and keeps running.
  refuseOnDuplicate: false

hmacSecret: "CHANGE_ME"

pollIntervalSeconds: 30
requestTimeoutSeconds: 10
pollLimit: 25
debug: false

# Per-backend feature toggles, so one jar can run different roles per server.
# Enforced now: rewards (reward delivery poller), cosmetics (cosmetics GUI),
# lobby (lobby manager + its menus/scoreboard/flight/protection). The rest are
# reserved/forward-looking. Omit this block to enable everything (current Lobby1
# behavior). Examples:
#   SMP:      rewards: true, cosmetics: false, lobby: false
#   Arcade:   rewards: true, cosmetics: true,  lobby: true
#   Anarchy:  rewards: true, cosmetics: false, lobby: false
modules:
  rewards: true
  cosmetics: true
  lobby: true
  menus: true
  scoreboards: true
  economy: false
  votes: true
  punishments: false
  chat: false
  # Network playtime tracking; keep on for every backend so totals span the
  # whole network.
  playtime: true
  # Generic stat leaderboard cache (placeholders + holograms).
  stats: true

# Disabled-by-default global economy client foundation. Phase 3 only prepares
# RealCore to talk to the DB-owned economy routes later; it does not register a
# Vault provider, replace EssentialsX, mutate local balances, or create gameplay
# earns/spends.
economy:
  enabled: false
  currencyKey: "realfiction_main"
  flushSeconds: 30
  bufferSize: 5000
  maxBatchSize: 100
  balanceCacheSeconds: 30
  # Phase 3 gameplay-server DB balance read path. Read-only: signed backend
  # requests can fetch canonical DB balances for online player checks without
  # starting the economy writer. Requires the DB policy row to have enabled=true
  # and can_read=true for this server. Keep off until staging verification.
  dbBalanceReadEnabled: false
  dbBalanceReadBackendAllowlist:
    - smp-1
  dbBalanceReadCacheSeconds: 30
  dbBalanceReadMaxPlayersPerBatch: 100
  # Phase 4 manual DB-to-Vault alignment. This reads canonical DB balances and,
  # only from an explicit admin command, can align local Vault/Essentials balance
  # for online SMP players. It never writes DB ledger entries and never runs
  # automatically. Keep dry-run default on until staging proves the path.
  syncVaultFromDbEnabled: false
  syncVaultFromDbBackendAllowlist:
    - smp-1
  syncVaultFromDbMaxPlayersPerRun: 25
  syncVaultFromDbMaxDeltaMinor: 250000
  syncVaultFromDbRequireOnline: true
  syncVaultFromDbDryRunDefault: true
  # Maximum amount for the admin-only /rf economy test command. Minor units:
  # $1.00 = 100, so the default is a tiny $1.00 staging credit.
  stagingTestMaxCreditMinor: 100
  # Phase 4E staging-only DB-to-Vault sync experiment. This remains OFF by
  # default and never runs automatically. When enabled on one staging backend,
  # admins may run /rf economy sync-vault <uuid> <username> to read the DB
  # balance and apply at most syncVaultMaxDeltaMinor to local Vault.
  syncVaultAfterDb: false
  syncVaultMaxDeltaMinor: 100
  # Phase 6C vote reward ledger shadow mode. RealCore computes and logs the
  # ledger transaction it would submit later, but this build never writes those
  # vote reward transactions to the economy API.
  voteRewardsToLedger: false
  voteRewardsLedgerDryRun: true
  # Phase 6E real vote reward ledger writes. Disabled by default; when enabled,
  # RealCore writes mapped vote rewards to the append-only economy ledger before
  # marking the reward delivered. Keep fallback commands on until cutover so the
  # existing eco give path remains available if the ledger write fails.
  voteRewardsLedgerWritesEnabled: false
  voteRewardsLedgerFallbackCommands: true
  # Phase 1 gameplay economy sync telemetry. Shadow-only: reads local Vault and
  # DB balances for online players and logs deltas. It never writes the ledger,
  # never mutates Vault/EssentialsX, and should first run on SMP only.
  vaultDeltaShadowEnabled: false
  vaultDeltaShadowIntervalSeconds: 300
  vaultDeltaShadowMaxPlayersPerRun: 100
  vaultDeltaShadowMinDeltaMinor: 1
  vaultDeltaShadowMaxLoggedDeltaMinor: 250000
  vaultDeltaShadowBackendAllowlist:
    - smp-1
  shadow:
    warningDeltaMinor: 5000
    severeDeltaMinor: 50000
    ignoreNegativeOneMinorNoise: true
    repeatedOffenderThreshold: 5
    observationCacheSize: 500
  # Phase 8 gameplay economy sync buffer (no producers wired in this phase).
  # Validates future gameplay deltas and optionally enqueues to the global writer.
  # Default: disabled with dryRun=true so nothing is sent to the ledger API.
  gameplaySync:
    enabled: false
    backendAllowlist:
      - smp-1
    categories:
      gameplayEarn: false
      gameplaySpend: false
      shopSell: false
      shopBuy: false
    flushSeconds: 30
    maxBatchSize: 50
    bufferSize: 5000
    maxCreditMinorPerTx: 50000
    maxDebitMinorPerTx: 50000
    dryRun: true
    logTransactions: true
    dedupCacheSeconds: 300
    dedupCacheMaxEntries: 10000
    producers:
      economyShopGuiSell:
        enabled: false
        category: shop_sell
        dryRun: true
        logEvents: true
        maxEventsPerFlush: 250

# Network playtime tracking (feeds the "Top Players" leaderboard/holograms).
# Each backend records its own sessions; the website sums them per player.
playtime:
  # How often active sessions are reported to the website.
  flushIntervalSeconds: 60
  # How often the leaderboard cache is refreshed (for placeholders/holograms).
  leaderboardRefreshSeconds: 300
  # How many entries each leaderboard placeholder set exposes.
  leaderboardSize: 10
  # Which boards to cache. 'all' is the network-wide total.
  leaderboardGroups:
    - all
    - lobby
    - smp
    - factions
    - anarchy
    - arcade

# Generic network stat leaderboards, cached for placeholders/holograms. Add any
# stat key here as new systems land (votes.total, economy.balance, ...).
# Placeholders: %realcore_stat_<key>_top_<n>_name% / _value% / _time% / _seconds% / _uuid%
# (playtime.* keys: _time and _seconds format seconds; _value is raw)
stats:
  enabled: true
  refreshSeconds: 120
  leaderboardSize: 10
  leaderboards:
    - playtime.total
    - playtime.lobby
    - playtime.smp
    - playtime.factions
    - playtime.anarchy
    - playtime.arcade
  # Buffered async writer for stat producers (kills/deaths/blocks/votes/money).
  # Producers call writer.increment/set in-memory; the writer batches and POSTs
  # to /api/plugin/stats/events on the schedule below. Folia-safe by design:
  # producers never touch DB/network on the call path.
  writer:
    # How often the writer drains its in-memory buffer and POSTs a batch.
    # 30s is a good balance between freshness and DB pressure.
    flushSeconds: 30
    # Hard cap on (statKey, subject, mode) entries held in memory across the
    # working buffer + retry deque. Excess events are dropped and counted.
    bufferSize: 50000
  # Producer toggles. Each producer is gated so a backend can opt out without a
  # rebuild; turning a producer off swaps the listener to a no-op on /rf reload.
  # economyMirror requires Vault and is OFF by default; the rest are on.
  producers:
    # PlayerDeathEvent -> kills.total / kills.<group>, deaths.total / deaths.<group>
    killsDeaths: true
    # BlockBreakEvent -> blocks_broken.total / blocks_broken.<group>
    blocksBroken: true
    # vote.standard reward delivery -> votes.total / votes.<group>
    # Idempotent via the existing reward ledger - only fresh deliveries count.
    votes: true
    # Mirror Vault economy balance -> money.total (set mode). money.* is plugin-
    # only on the website (never in the public leaderboard allowlist). Defaults
    # OFF: enable on exactly one backend, ideally the one with the authoritative
    # economy plugin loaded. Requires Vault + an Economy provider; logs once and
    # no-ops if either is missing.
    economyMirror: false
    economyMirrorSeconds: 300

capabilities:
  - luckperms
  - cosmetics
  - vote_rewards
  - console_commands

# Proxy server-name aliases. These keep old menu configs working if a target
# server was renamed in Velocity/Crafty.
proxy:
  serverAliases:
    RealAnarchy: "Anarchy"

linking:
  platform: "java"

rewards:
  # RealCore refuses unsafe rewards. Leave this false unless staff are testing.
  allowUnsafeRewards: false

  # Usernames whose votes are placeholders/tests (e.g. PlanetMinecraft sends a
  # "PMC" test vote). These never run reward commands and are settled as failed.
  # Remove the entry (or set an empty list) to disable skipping.
  skipUsernames:
    - PMC

  # Local permission mapping for cosmetic products that do not carry a specific
  # LuckPerms permission in the website payload yet.
  productPermissions:
    realpets-pack: "realfiction.pets.pack"
    particle-vault: "realfiction.particles.vault"
    username-colors: "realfiction.username.colors"
    lobby-flight: "realfiction.lobby.flight"
    cosmetic-atelier: "realfiction.cosmetics.atelier"

  # Phase 6C ledger shadow mappings. These do not replace the command rewards
  # below yet; they only log the intended economy transaction for review.
  economy:
    byRewardKey:
      vote.standard:
        amountMinor: 25000
        currencyKey: realfiction_main
        category: vote_reward
      vote.milestone.5:
        amountMinor: 50000
        currencyKey: realfiction_main
        category: vote_reward
      vote.milestone.15:
        amountMinor: 100000
        currencyKey: realfiction_main
        category: vote_reward
      vote.milestone.30:
        amountMinor: 150000
        currencyKey: realfiction_main
        category: vote_reward
      vote.milestone.75:
        amountMinor: 250000
        currencyKey: realfiction_main
        category: vote_reward

  # Console command rewards. These run from console after a reward is polled.
  # Placeholders: {player}, {uuid}, {rewardKey}, {rewardId}, {quantity},
  # {serverId}, {productSlug}, {voteSite}
  commands:
    byRewardKey:
      vote.standard:
        - "eco give {player} 250"
      vote.milestone.5:
        - "eco give {player} 500"
      vote.milestone.15:
        - "eco give {player} 1000"
      vote.milestone.30:
        - "eco give {player} 1500"
      vote.milestone.75:
        - "eco give {player} 2500"
    byProductSlug: {}

  # Friendly player messages after a reward is delivered. These also use the
  # placeholders above and run safely from the server scheduler.
  messages:
    player:
      byRewardKey:
        vote.standard:
          - "Thanks for voting for RealFiction! You earned $250."
        vote.milestone.5:
          - "Vote streak bonus! You earned an extra $500."
        vote.milestone.15:
          - "Vote streak bonus! You earned an extra $1000."
        vote.milestone.30:
          - "Vote streak bonus! You earned an extra $1500."
        vote.milestone.75:
          - "Huge vote streak bonus! You earned an extra $2500."
    broadcast:
      enabled: false
      byRewardKey:
        vote.standard:
          - "{player} voted for RealFiction and earned a reward!"
        vote.milestone.5:
          - "{player} hit a 5 vote streak and earned a bonus!"
        vote.milestone.15:
          - "{player} hit a 15 vote streak and earned a bonus!"
        vote.milestone.30:
          - "{player} hit a 30 vote streak and earned a bonus!"
        vote.milestone.75:
          - "{player} hit a 75 vote streak and earned a bonus!"

# ---------------------------------------------------------------------------
# Lobby module (replaces PhoenixLobby). Everything below is local to this
# server and never affects the website linking/reward HMAC contract above.
# ---------------------------------------------------------------------------
lobby:
  enabled: true
  # Worlds where lobby behavior is active.
  worlds:
    - Void_Spawn
  # Allow normal players to use /rf menu, /rf lobbies, /rf spawn.
  playerCommands: true
  # Spawn point used by /rf spawn and void protection. Set in-game with
  # /rf setspawn, or fill in manually.
  spawn:
    world: Void_Spawn
    # x: 0.5
    # y: 100.0
    # z: 0.5
    # yaw: 0.0
    # pitch: 0.0
  # Scaffold for multiple lobbies (used by the lobby selector later).
  lobbies:
    lobby-1:
      displayName: "&aLobby 1"
      server: "Lobby1"
      current: true

# Lobby protections. All default true; only apply inside lobby worlds.
protection:
  hunger: true
  pvp: true
  fire: true
  drowning: true
  voidDeath: true
  deathMessages: true
  mobSpawning: true
  itemDrop: true
  itemPickup: true
  blockBreak: true
  blockPlace: true
  blockInteract: true
  fireSpread: true
  leafDecay: true
  offhandSwap: true
  weather: true

# Join handling.
join:
  setAdventure: true
  sound: true
  # Legacy potion-speed option. RealCore now uses walkSpeed below for lobby movement.
  speed: false
  speedAmplifier: 1
  firework: false
  clearInventory: false
  clearEffects: false
  giveItems: true
  # Leave blank to keep vanilla messages. Supports %player%.
  joinMessage: ""
  quitMessage: ""

# Lobby flight perk.
# This is a paid/supporter perk. Default players do not get real flight.
lobbyFlight:
  enabled: true
  permission: "realfiction.lobby.flight"

# Default lobby double-jump. This does not require a permission.
doubleJump:
  enabled: true
  upwardVelocity: 0.85
  forwardVelocity: 1.15
  resetDelayTicks: 8

# Default lobby walk speed. Vanilla walking is 0.20; 0.26 is about 30% faster.
walkSpeed:
  enabled: true
  speed: 0.26

# ---------------------------------------------------------------------------
# Cosmetics Phase 1. Cosmetic only: no gameplay advantages.
# ---------------------------------------------------------------------------
cosmetics:
  enabled: true
  gui:
    title: "&aRealFiction Cosmetics"
    size: 45
  categories:
    pets:
      enabled: true
      name: "&aPets"
      material: BONE
      permission: "realfiction.pets.pack"
    particles:
      enabled: true
      name: "&aParticles"
      material: EMERALD
      permission: "realfiction.particles.vault"
    trails:
      enabled: true
      name: "&fTrails"
      material: FEATHER
      permission: "realfiction.particles.vault"
    username-colors:
      enabled: true
      name: "&bUsername Colors"
      material: NAME_TAG
      permission: "realfiction.username.colors"
    lobby-flight:
      enabled: true
      name: "&bLobby Flight"
      material: ELYTRA
      permission: "realfiction.lobby.flight"
  options:
    pets:
      pet-pack:
        name: "&aPets Pack"
        material: BONE
        permission: "realfiction.pets.pack"
        placeholder: true
        lore:
          - "&7Pet AI is coming soon."
    particles:
      emerald-aura:
        name: "&aEmerald Aura"
        material: EMERALD
        permission: "realfiction.particles.vault"
        particle: HAPPY_VILLAGER
        lore:
          - "&7A soft lobby sparkle."
    trails:
      cloud-trail:
        name: "&fCloud Trail"
        material: FEATHER
        permission: "realfiction.particles.vault"
        particle: CLOUD
        lore:
          - "&7A light trail as you move."
    username-colors:
      green:
        name: "&aGreen Name"
        material: LIME_DYE
        permission: "realfiction.username.colors"
        color: "&a"
      gold:
        name: "&6Gold Name"
        material: GOLD_INGOT
        permission: "realfiction.username.colors"
        color: "&6"
      aqua:
        name: "&bAqua Name"
        material: DIAMOND
        permission: "realfiction.username.colors"
        color: "&b"
    lobby-flight:
      toggle:
        name: "&bLobby Flight"
        material: FEATHER
        permission: "realfiction.lobby.flight"
        lore:
          - "&7Turn lobby flight on or off."

# Sidebar scoreboard.
scoreboard:
  enabled: true
  refreshTicks: 20
  title: "&a&lRealFiction"
  lines:
    - ""
    - " &6Welcome!"
    - " &fUser: &7%player%"
    - " &fOnline: &a%online%/%max_online%"
    - ""
    - "&7Java:"
    - "&erealfiction.live"
    - "&7Bedrock:"
    - "&eplay.realfiction.live"

# Lobby hotbar items. slot is 1-9 (hotbar). type is menu or visibility.
lobbyItems:
  game-menu:
    slot: 1
    type: menu
    menu: game-menu
    material: PLAYER_HEAD
    glow: true
    name: "&aGame Menu &7(Right Click)"
  lobby-selector:
    slot: 3
    type: menu
    menu: lobby-selector
    material: BOOK
    glow: false
    name: "&aLobby Selector &7(Right Click)"
  player-visibility:
    slot: 9
    type: visibility
    cooldownSeconds: 3
    on:
      material: LIME_DYE
      name: "&fPlayers: &aVisible &7(Right Click)"
    off:
      material: GRAY_DYE
      name: "&fPlayers: &cHidden &7(Right Click)"

