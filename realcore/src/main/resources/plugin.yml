name: RealCore
version: ${project.version}
main: com.realfiction.realcore.RealCorePlugin
api-version: "1.21"
author: RealFiction
description: RealFiction account linking and reward delivery.
softdepend:
  - LuckPerms
commands:
  realfiction:
    description: Link your Minecraft account to RealFiction.
    usage: /realfiction <link|status|reload>
    aliases:
      - rf
permissions:
  realcore.admin:
    description: Allows RealCore admin commands.
    default: op
