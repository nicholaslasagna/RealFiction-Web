name: RealCore
version: ${project.version}
main: com.realfiction.realcore.RealCorePlugin
api-version: "1.21"
# RealCore uses the region/Folia-aware scheduler abstraction (FoliaScheduler),
# never touches the Bukkit API off-thread, and keeps DB/HTTP work async. This
# flag lets Folia load the plugin instead of refusing it.
folia-supported: true
author: RealFiction
description: RealFiction account linking, reward delivery, and lobby.
softdepend:
  - LuckPerms
  - PlaceholderAPI
commands:
  realfiction:
    description: RealFiction linking, rewards, and lobby commands.
    usage: /realfiction <link|menu|lobbies|cosmetics|spawn|status|stats|economy|rewards|reload|setspawn>
  rf:
    description: RealFiction linking, rewards, and lobby commands.
    usage: /rf <link|menu|lobbies|cosmetics|spawn|status|stats|economy|rewards|reload|setspawn>
  realcore:
    description: RealFiction linking, rewards, and lobby commands.
    usage: /realcore <link|menu|lobbies|cosmetics|spawn|status|stats|economy|rewards|reload|setspawn>
  cosmetics:
    description: Open your RealFiction cosmetics.
    usage: /cosmetics
permissions:
  realcore.admin:
    description: Allows RealCore admin commands (status, reload, setspawn).
    default: op
  realcore.lobby.bypass:
    description: Bypass lobby build, interact, drop, and pickup protections.
    default: op
  realfiction.lobby.flight:
    description: Allows flight inside lobby worlds.
    default: false
  realfiction.pets.pack:
    description: Allows RealFiction pet cosmetics.
    default: false
  realfiction.particles.vault:
    description: Allows RealFiction particle and trail cosmetics.
    default: false
  realfiction.username.colors:
    description: Allows RealFiction username colors.
    default: false
  realfiction.cosmetics.atelier:
    description: Allows RealFiction premium cosmetic previews.
    default: false
